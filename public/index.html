<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RT Pocket">
<meta name="theme-color" content="#0a0a0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>RT Pocket</title>
<style>
  :root { --bg: #0a0a0e; --ink: #e8ecf4; --sub: #8a93a8; --pill: #1c1f28; --edge: #2a2e3a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #stage { position: relative; width: 100%; max-width: 560px; margin: 0 auto; transition: transform 0.18s ease-out; }
  #screen { width: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px 6px; }
  #status { color: var(--sub); font-size: 13px; text-align: center; padding: 0 16px; min-height: 0; }
  #status:empty { display: none; }
  #status.bad { color: #ff7a6a; }
  button { background: var(--pill); color: var(--ink); border: 1px solid var(--edge); border-radius: 20px; padding: 8px 12px; font: inherit; font-size: 14px; }
  button:active { background: var(--edge); }
  button.on { background: #0a84ff; border-color: #0a84ff; color: #fff; }
  /* while typing: Done, Back and Paste (Size and Alerts wait) */
  #pasteBtn { display: none; }
  body.typing #pasteBtn { display: inline-block; }
  body.typing #sizeBtn, body.typing #alertsBtn { display: none !important; }
  #kbd { position: fixed; left: -1000px; top: 0; opacity: 0; width: 10px; height: 10px; font-size: 16px; }
  #stopped { display: none; text-align: center; padding: 10px 20px; }
  #hint { display: none; position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); background: #f2f2f7; color: #1c1c1e;
    border-radius: 14px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.45); font-size: 15px; line-height: 1.35; }
  #hint b { display: block; margin-bottom: 4px; }
  #hint button { background: #0a84ff; color: #fff; border: 0; margin-top: 10px; }
  #alertsMenu { display: none; position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: 420px; margin: 0 auto; background: var(--pill); border: 1px solid var(--edge); border-radius: 16px; padding: 16px; text-align: center; z-index: 10; }
  #alertsMenu b { display: block; margin-bottom: 4px; }
  #alertsMenu span { display: block; font-size: 13px; opacity: 0.75; margin-bottom: 10px; }
  #alertsMenu button { display: block; width: 100%; margin-top: 8px; }
  #alertsMenu #alertsOff { color: #ff6b5e; }
  #customSheet, #shareSheet { display: none; position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: 420px; margin: 0 auto; background: var(--pill); border: 1px solid var(--edge); border-radius: 16px; padding: 16px; text-align: center; z-index: 11; }
  #customSheet b, #shareSheet b { display: block; margin-bottom: 4px; }
  #customSheet span, #shareSheet span { display: block; font-size: 13px; opacity: 0.75; margin-bottom: 10px; }
  #customSheet button, #shareSheet button { display: block; width: 100%; margin-top: 8px; }
  #customSave, #shareGo { background: #0a84ff !important; border-color: #0a84ff !important; color: #fff; }
  #groups { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; text-align: left; }
  #groups label { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); border-radius: 10px; font-size: 15px; }
  #groups input { width: 18px; height: 18px; accent-color: #0a84ff; }
  #calSheet { display: none; position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: 420px; margin: 0 auto; background: var(--pill); border: 1px solid var(--edge); border-radius: 16px; padding: 16px; text-align: center; z-index: 10; }
  #calSheet b { display: block; margin-bottom: 6px; }
  #calSheet span { display: block; font-size: 14px; margin-bottom: 4px; }
  #calSheet #calWhen { font-size: 13px; opacity: 0.75; margin-bottom: 10px; }
  #calSheet button { display: block; width: 100%; margin-top: 8px; }
  #calSheet #calAdd { background: #0a84ff; border-color: #0a84ff; color: #fff; }
  /* behind the phone's own status bar: the top of the pocket's screen, so they meet as one (app.js) */
  #topband { position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top); background: var(--bg); z-index: 1; transition: background 0.2s; }
  /* sideways: the screen as tall as the phone is, the buttons beside it */
  @media (orientation: landscape) and (max-height: 560px) {
    #wrap { flex-direction: row; align-items: center; justify-content: center; gap: 4px;
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    #stage { width: auto; max-width: none; height: calc(100% - 12px); margin: 0; }
    #screen { width: auto; height: 100%; }
    #bar { flex-direction: column; flex-wrap: nowrap; padding: 8px 10px; }
    #bar button { width: 128px; }
    #status { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 4px); }
  }
</style>
</head>
<body>
<div id="topband"></div>
<div id="wrap">
  <div id="stage"><canvas id="screen" width="156" height="180"></canvas></div>
  <div id="bar">
    <button id="kbBtn" type="button">Keyboard</button>
    <button id="backBtn" type="button">Back</button>
    <button id="sizeBtn" type="button">Size</button>
    <button id="alertsBtn" type="button" style="display:none">Alerts</button>
    <button id="pasteBtn" type="button">Paste</button>
  </div>
  <div id="status">Starting...</div>
  <div id="stopped"><p id="why"></p><button id="restart" type="button">Start again</button></div>
</div>
<div id="alertsMenu"><b>Alerts on this phone</b><span>While you're away from the game and the app.</span>
  <button type="button" data-mode="all">Everything</button><button type="button" data-mode="chat">Messages and mail only</button>
  <button type="button" data-mode="custom">Custom...</button>
  <button type="button" id="alertsPause">Pause for an hour</button>
  <button type="button" id="alertsMorning">Pause until morning</button>
  <button type="button" id="alertsTest">Send a test alert</button>
  <button type="button" id="alertsOff">Turn off</button><button type="button" id="alertsCancel">Cancel</button></div>
<div id="customSheet"><b>Which alerts?</b><span>The ones ticked come to this phone.</span>
  <div id="groups"></div>
  <button type="button" id="customSave">Save</button><button type="button" id="customCancel">Cancel</button></div>
<div id="shareSheet"><b>Share this event?</b><span id="shareTitle"></span>
  <button type="button" id="shareGo">Share</button><button type="button" id="shareCancel">Cancel</button></div>
<div id="calSheet"><b>Add to your calendar?</b><span id="calTitle"></span><span id="calWhen"></span>
  <button type="button" id="calAdd">Add to Calendar</button><button type="button" id="calCancel">Cancel</button></div>
<div id="hint"><b>Put RT Pocket on your Home Screen</b><span id="hintText"></span><br><button id="hintOk" type="button">Got it</button></div>
<input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
<script src="app.js"></script>
</body>
</html>
